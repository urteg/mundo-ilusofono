<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      background: #fdfaf4;
      font-family: Arial, Helvetica, sans-serif;
      color: #1e272e;
    "
  >
    <div style="max-width: 520px; margin: 0 auto; padding: 32px 24px">
      <h1 style="font-size: 24px; color: #0a3d62; margin: 0 0 16px">Seu link para entrar</h1>
      <p style="font-size: 16px; line-height: 1.5; margin: 0 0 24px">
        Toque no botão abaixo para entrar no Mundo Ilusófono. Não precisa de senha.
      </p>
      <p style="margin: 0 0 24px">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            background: #0665b8;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 999px;
          "
        >
          Entrar no Mundo Ilusófono
        </a>
      </p>
      <p style="font-size: 14px; line-height: 1.5; color: #4a5560; margin: 0 0 8px">
        O link vale por uma hora e só funciona uma vez. Se você não pediu para entrar, pode ignorar
        este e-mail.
      </p>
      <p style="font-size: 14px; color: #4a5560; margin: 24px 0 0">
        O português se vive, não só se estuda.
      </p>
    </div>
  </body>
</html>
