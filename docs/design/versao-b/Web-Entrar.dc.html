<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>App web: entrar</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #fdfaf4;
            color: #1e272e;
            font-family: "Nunito Sans", system-ui, sans-serif;
          }
          * {
            box-sizing: border-box;
          }
          a {
            color: #0665b8;
          }
          a:hover {
            color: #0a3d62;
          }
          .h {
            font-family: "Fredoka", system-ui, sans-serif;
            font-weight: 600;
            margin: 0;
            line-height: 1.08;
            color: #0a3d62;
          }
          .cv {
            font-family: "Caveat", cursive;
            font-weight: 600;
            color: #c2410c;
          }
          .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 56px;
            padding: 0 32px;
            border-radius: 999px;
            background: #0665b8;
            color: #fff;
            font-family: "Fredoka", system-ui, sans-serif;
            font-weight: 600;
            font-size: 19px;
            text-decoration: none;
            border: 0;
            cursor: pointer;
          }
          .btn:hover {
            background: #0a3d62;
            color: #fff;
          }
          .btn.sm {
            min-height: 46px;
            padding: 0 24px;
            font-size: 16px;
          }
          .btn.lt {
            background: #fdfaf4;
            color: #0a3d62;
          }
          .btn2 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 24px;
            border-radius: 999px;
            border: 2px solid #0665b8;
            color: #0665b8;
            background: transparent;
            font-family: "Fredoka", system-ui, sans-serif;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
          }
          .btn2.lt {
            border-color: #fdfaf4;
            color: #fdfaf4;
          }
          .wrap {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 40px;
          }
          .card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
            padding: 24px;
          }
          .eyebrow {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.04em;
            color: #0665b8;
          }
          .pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
            font-weight: 800;
            font-size: 15px;
          }
          .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            border: 2px solid #cfc6b2;
            background: #fff;
            color: #1e272e;
            font-weight: 700;
            font-size: 15px;
            font-family: "Nunito Sans", system-ui, sans-serif;
            cursor: pointer;
          }
          .chip.on {
            background: #0a3d62;
            border-color: #0a3d62;
            color: #fff;
          }
          .lvb {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 3px 12px 3px 9px;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
          }
          .vc {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
          }
          .vt {
            height: 190px;
            position: relative;
            overflow: hidden;
          }
          .vt svg {
            position: absolute;
            left: 0;
            top: 0;
          }
          .dur {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: rgba(10, 61, 98, 0.92);
            color: #fff;
            border-radius: 8px;
            padding: 2px 9px;
            font-size: 13px;
            font-weight: 800;
          }
          .pg {
            height: 6px;
            background: #ece4d2;
          }
          .pg i {
            display: block;
            height: 100%;
            background: #00b894;
          }
          .vb {
            padding: 14px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
          }
          .bar {
            height: 12px;
            border-radius: 999px;
            background: #ece4d2;
            overflow: hidden;
          }
          .bar i {
            display: block;
            height: 100%;
            background: #00b894;
          }
          .top a.n {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            color: #1e272e;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
          }
          .top a.n.on {
            background: #0a3d62;
            color: #fff;
          }
          .sw {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            font-weight: 700;
            cursor: pointer;
          }
          .tg {
            display: inline-flex;
            background: #ece4d2;
            border-radius: 999px;
            padding: 6px;
            gap: 4px;
          }
          .tg button {
            min-height: 48px;
            padding: 0 28px;
            border-radius: 999px;
            border: 0;
            background: transparent;
            font-family: "Fredoka", system-ui, sans-serif;
            font-weight: 600;
            font-size: 18px;
            color: #1e272e;
            cursor: pointer;
          }
          table {
            border-collapse: collapse;
            width: 100%;
            font-size: 17px;
          }
          th,
          td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #ece4d2;
          }
          th {
            font-family: "Fredoka", system-ui, sans-serif;
            color: #0a3d62;
            font-size: 18px;
          }

          body {
            background: #fdfaf4;
          }
        </style>
      </helmet>
      <div style="width: 100%; min-height: 780px">
        <div
          style="
            min-height: 760px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f6f0e4;
          "
        >
          <div
            class="card"
            style="
              width: 100%;
              max-width: 460px;
              padding: 40px;
              display: flex;
              flex-direction: column;
              gap: 18px;
            "
          >
            <a
              href="Main.dc.html"
              style="display: flex; align-items: center; gap: 10px; text-decoration: none"
              ><span
                style="
                  width: 42px;
                  height: 38px;
                  background: #0984e3;
                  border-radius: 14px 14px 14px 4px;
                  display: inline-block;
                "
                aria-hidden="true"
              ></span
              ><span class="h" style="font-size: 24px; color: #0a3d62">Mundo Ilusófono</span></a
            >
            <h1 class="h" style="font-size: 36px; margin-top: 8px">Entrar ou criar conta</h1>
            <p style="margin: 0; font-size: 18px; line-height: 1.55; color: #2f3b44">
              Digite seu e-mail. Enviamos um link para você entrar, sem senha.
            </p>
            <label for="e" style="font-weight: 800">Seu e-mail</label
            ><input
              id="e"
              type="email"
              placeholder="voce@email.com"
              style="
                min-height: 56px;
                border-radius: 14px;
                border: 2px solid #cfc6b2;
                padding: 0 16px;
                font-size: 18px;
                font-family:
                  Nunito Sans,
                  sans-serif;
              "
            /><a class="btn" href="Web-Inicio.dc.html">Enviar link de acesso</a>
            <p style="margin: 0; font-size: 14px; color: #4a5560; line-height: 1.5">
              Ao continuar, você aceita os termos e a política de privacidade. Os preços do Mundo
              Ilusófono não incluem imposto.
            </p>
          </div>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":780}}'>
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>

</html>
