<!doctype html>

    <x-dc>

        />
        <style>
          body {
            margin: 0;
            background: #fdfaf4;
            color: #1e272e;
            font-family: "Nunito Sans", system-ui, sans-serif;
          }
          * {
            box-sizing: border-box;
          }
          a {
            color: #0665b8;
          }
          a:hover {

          }
          .h {

            margin: 0;
            line-height: 1.08;
            color: #0a3d62;
          }
          .cv {
            font-family: "Caveat", cursive;
            font-weight: 600;
            color: #c2410c;
          }
          .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 56px;
            padding: 0 32px;
            border-radius: 999px;
            background: #0665b8;
            color: #fff;
            font-family: "Fredoka", system-ui, sans-serif;
            font-weight: 600;
            font-size: 19px;
            text-decoration: none;
            border: 0;
            cursor: pointer;
          }
          .btn:hover {
            background: #0a3d62;
            color: #fff;
          }
          .btn.sm {
            min-height: 46px;
            padding: 0 24px;
            font-size: 16px;
          }
          .btn.lt {
            background: #fdfaf4;
            color: #0a3d62;
          }
          .btn2 {

            color: #0665b8;
            background: transparent;
            font-family: "Fredoka", system-ui, sans-serif;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
          }
          .btn2.lt {
            border-color: #fdfaf4;
            color: #fdfaf4;
          }
          .wrap {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 40px;
          }
          .card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
            padding: 24px;
          }
          .eyebrow {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.04em;
            color: #0665b8;
          }
          .pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
            font-weight: 800;
            font-size: 15px;
          }
          .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 999px;

            background: #fff;
            color: #1e272e;
            font-weight: 700;
            font-size: 15px;
            font-family: "Nunito Sans", system-ui, sans-serif;
            cursor: pointer;
          }
          .chip.on {
            background: #0a3d62;
            border-color: #0a3d62;
            color: #fff;
          }
          .lvb {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 3px 12px 3px 9px;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
          }
          .vc {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);

            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
          }
          .vt {
            height: 190px;
            position: relative;
            overflow: hidden;
          }
          .vt svg {
            position: absolute;
            left: 0;
            top: 0;
          }
          .dur {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: rgba(10, 61, 98, 0.92);
            color: #fff;
            border-radius: 8px;
            padding: 2px 9px;
            font-size: 13px;
            font-weight: 800;
          }
          .pg {
            height: 6px;
            background: #ece4d2;
          }
          .pg i {
            display: block;
            height: 100%;
            background: #00b894;
          }
          .vb {
            padding: 14px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
          }
          .bar {
            height: 12px;
            border-radius: 999px;
            background: #ece4d2;
            overflow: hidden;
          }
          .bar i {
            display: block;
            height: 100%;
            background: #00b894;
          }
          .top a.n {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            color: #1e272e;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
          }
          .top a.n.on {
            background: #0a3d62;
            color: #fff;
          }
          .sw {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            font-weight: 700;
            cursor: pointer;
          }
          .tg {
            display: inline-flex;
            background: #ece4d2;
            border-radius: 999px;
            padding: 6px;
            gap: 4px;
          }
          .tg button {
            min-height: 48px;
            padding: 0 28px;
            border-radius: 999px;
            border: 0;
            background: transparent;
            font-family: "Fredoka", system-ui, sans-serif;
            font-weight: 600;
            font-size: 18px;
            color: #1e272e;
            cursor: pointer;
          }
          table {
            border-collapse: collapse;
            width: 100%;
            font-size: 17px;
          }
          th,
          td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #ece4d2;
          }
          th {
            font-family: "Fredoka", system-ui, sans-serif;
            color: #0a3d62;
            font-size: 18px;
          }

          body {
            background: #fdfaf4;
          }

          .ph {
            width: 390px;
            height: 844px;
            background: #fdfaf4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
          }
          .pc {
            flex-grow: 1;
            padding: 44px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
          }
          .pn {
            display: flex;
            border-top: 1px solid #ece4d2;
            background: #fff;
            padding-bottom: 14px;
          }
          .pn a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 58px;
            font-size: 12px;
            font-weight: 800;
            color: #4a5560;
            text-decoration: none;
          }
          .pn a.on {
            color: #0665b8;
          }
          .pcard {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
          }
          .pv {
            display: flex;
            gap: 12px;
            background: #fff;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(30, 39, 46, 0.08);
            text-decoration: none;
            color: inherit;
          }
          .pt {
            flex: 0 0 118px;
            height: 72px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
          }
          .pt .dur {
            right: 5px;
            bottom: 5px;
            font-size: 11px;
            padding: 1px 6px;
          }

        <div class="ph">
          <div class="pc">
            <div

                display: flex;
                flex-direction: column;

                    height: 36px;
                    background: #0984e3;
                    border-radius: 14px 14px 14px 4px;
                    display: inline-block;

                ></span
                ><span class="h" style="font-size: 22px; color: #0a3d62">Mundo Ilusófono</span></a

              <p style="margin: 0; font-size: 16px; line-height: 1.5">

              </p>
              <label for="e" style="font-weight: 800">Seu e-mail</label
              ><input
                id="e"
                type="email"
                placeholder="voce@email.com"
                style="
                  min-height: 52px;
                  border-radius: 14px;
                  border: 2px solid #cfc6b2;
                  padding: 0 14px;
                  font-size: 17px;
                  font-family:
                    Nunito Sans,
                    sans-serif;
                "
              /><a class="btn" href="App-Inicio.dc.html">Enviar link de acesso</a
              ><span style="font-size: 13px; color: #4a5560">Os preços não incluem imposto.</span>
            </div>
          </div>
        </div>
      </div>
