<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Assistir</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;family=Caveat:wght@600&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            background: #fdfaf4;
          }
          a {
            color: #0665b8;
          }
          a:hover {
            color: #0a3d62;
          }
          .mi {
            font-family: "Nunito Sans", system-ui, sans-serif;
            color: #1e272e;
            background: #fdfaf4;
            font-size: 16px;
            line-height: 1.55;
          }
          .mi h1,
          .mi h2,
          .mi h3 {
            font-family: "Fredoka", ui-rounded, sans-serif;
            color: #0a3d62;
            margin: 0;
            line-height: 1.15;
            font-weight: 600;
          }
          .wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 32px;
            box-sizing: border-box;
          }
          .card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
          }
          .lv {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font:
              700 12px/1.3 "Nunito Sans",
              sans-serif;
          }
          .lv1 {
            background: #d7f3ec;
            color: #00684f;
          }
          .lv2 {
            background: #dcebfa;
            color: #0665b8;
          }
          .lv3 {
            background: #ffe4d6;
            color: #b23a0b;
          }
          .lv4 {
            background: #dde5ee;
            color: #0a3d62;
          }
          .muted {
            color: #4a5560;
          }
          .bar {
            height: 8px;
            border-radius: 999px;
            background: #ece4d2;
            overflow: hidden;
          }
          .bar i {
            display: block;
            height: 100%;
            background: #00b894;
            border-radius: 999px;
          }
          .thumb {
            display: block;
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
          }
          .tab {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            color: #1e272e;
            text-decoration: none;
            font:
              600 16px "Fredoka",
              sans-serif;
          }
          .tab:hover {
            background: #f6f0e4;
            color: #0a3d62;
          }
          .tab.on {
            color: #0665b8;
            background: #dcebfa;
          }
          .pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 52px;
            padding: 4px 4px 4px 16px;
            border: 2px solid #ece4d2;
            border-radius: 999px;
            background: #fff;
            font:
              700 14px "Nunito Sans",
              sans-serif;
            box-sizing: border-box;
          }
          .ib {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 0;
            background: #dcebfa;
            color: #0665b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            flex: none;
          }
          .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            padding: 0 16px;
            border: 2px solid #cfc6b2;
            border-radius: 999px;
            background: #fff;
            color: #1e272e;
            font:
              600 15px "Nunito Sans",
              sans-serif;
            cursor: pointer;
          }
          .chip:hover {
            border-color: #0a3d62;
          }
          .chip.on {
            background: #0a3d62;
            border-color: #0a3d62;
            color: #fff;
          }
          .sel {
            min-height: 44px;
            border: 2px solid #cfc6b2;
            border-radius: 999px;
            background: #fff;
            padding: 0 14px;
            font:
              600 15px "Nunito Sans",
              sans-serif;
            color: #1e272e;
            cursor: pointer;
          }
          .utab {
            min-height: 44px;
            padding: 0 4px;
            border: 0;
            background: transparent;
            font:
              600 18px "Fredoka",
              sans-serif;
            color: #4a5560;
            border-bottom: 3px solid transparent;
            cursor: pointer;
          }
          .utab.on {
            color: #0665b8;
            border-bottom-color: #0665b8;
          }
          .sw {
            position: relative;
            width: 48px;
            height: 28px;
            border-radius: 999px;
            background: #cfc6b2;
            border: 0;
            cursor: pointer;
            flex: none;
            padding: 0;
          }
          .sw.on {
            background: #00b894;
          }
          .sw i {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: #fff;
            transition: left 0.15s;
          }
          .sw.on i {
            left: 23px;
          }
          .kebab {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 0;
            background: rgba(255, 255, 255, 0.92);
            color: #1e272e;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
          }
          :focus-visible {
            outline: 3px solid #0984e3;
            outline-offset: 2px;
          }
        </style>
      </helmet>
      <div class="mi">
        <header style="background: #fff; border-bottom: 1px solid #ece4d2">
          <div
            class="wrap"
            style="
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              gap: 12px 24px;
              padding-top: 10px;
              padding-bottom: 10px;
            "
          >
            <a
              href="App-Inicio.dc.html"
              style="
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                color: #0a3d62;
                font:
                  700 20px &quot;Fredoka&quot;,
                  sans-serif;
              "
              ><img
                src="marca/logo.png"
                alt=""
                width="46"
                height="46"
                style="display: block; width: 46px; height: 46px; object-fit: contain"
              /><span style="display: flex; flex-direction: column; line-height: 1"
                ><span>Mundo</span><span>Ilusófono</span></span
              ></a
            >
            <nav
              aria-label="App"
              style="
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                flex: 1 1 auto;
                justify-content: center;
              "
            >
              <a class="tab" href="App-Inicio.dc.html">Início</a
              ><a class="tab on" href="App-Assistir.dc.html" aria-current="page">Assistir</a
              ><a class="tab" href="App-Series.dc.html">Séries</a
              ><a class="tab" href="App-Lives.dc.html">Lives</a
              ><a class="tab" href="App-Progresso.dc.html">Progresso</a
              ><a class="tab" href="App-Conta.dc.html">Conta</a>
            </nav>
            <div style="display: flex; gap: 10px; align-items: center">
              <div class="pill">
                <span>12/20 min</span
                ><span class="bar" style="width: 64px"><i style="width: 60%"></i></span
                ><a class="ib" href="App-Horas.dc.html" aria-label="Adicionar tempo fora do app"
                  ><svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14M5 12h14"></path></svg
                ></a>
              </div>
              <div
                class="pill"
                style="padding-right: 16px; color: #9a3412"
                aria-label="Sequência de 3 dias"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#9A3412"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"
                  ></path></svg
                >3
              </div>
            </div>
          </div>
        </header>

        <main
          class="wrap"
          style="
            padding-top: 36px;
            padding-bottom: 64px;
            display: flex;
            flex-direction: column;
            gap: 24px;
          "
        >
          <h1 style="font-size: 36px">O que vamos assistir?</h1>
          <div
            role="tablist"
            aria-label="Seções"
            style="display: flex; gap: 28px; border-bottom: 1px solid #ece4d2"
          >
            <sc-for list="{{abas}}" as="a" hint-placeholder-count="3"
              ><button
                role="tab"
                type="button"
                class="{{a.cls}}"
                aria-selected="{{a.sel}}"
                onClick="{{a.pick}}"
              >
                {{a.nome}}
              </button></sc-for
            >
          </div>

          <div style="display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
              <span style="font-weight: 700; margin-right: 4px">Nível</span>
              <sc-for list="{{niveis}}" as="n" hint-placeholder-count="5"
                ><button
                  type="button"
                  class="{{n.cls}}"
                  aria-pressed="{{n.sel}}"
                  onClick="{{n.pick}}"
                >
                  {{n.nome}}
                </button></sc-for
              >
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
              <label style="display: inline-flex; align-items: center; gap: 8px"
                ><span class="muted" style="font-size: 14px; font-weight: 700">Ordenar</span
                ><select class="sel" onChange="{{onOrdem}}">
                  <option value="novos">Mais novos</option>
                  <option value="faceis">Mais fáceis</option>
                  <option value="dificeis">Mais difíceis</option>
                  <option value="curtos">Mais curtos</option>
                </select></label
              >
              <label style="display: inline-flex; align-items: center; gap: 8px"
                ><span class="muted" style="font-size: 14px; font-weight: 700">País</span
                ><select class="sel" onChange="{{onPais}}">
                  <option value="">Todos</option>
                  <option>Brasil</option>
                  <option>Portugal</option>
                  <option>Angola</option>
                </select></label
              >
              <label style="display: inline-flex; align-items: center; gap: 8px"
                ><span class="muted" style="font-size: 14px; font-weight: 700">Apresentador</span
                ><select class="sel" onChange="{{onApres}}">
                  <option value="">Todos</option>
                  <option>Márlio</option>
                  <option>Convidado</option>
                </select></label
              >
              <label style="display: inline-flex; align-items: center; gap: 8px"
                ><span class="muted" style="font-size: 14px; font-weight: 700">Tema</span
                ><select class="sel" onChange="{{onTema}}">
                  <option value="">Todos</option>
                  <option>Comida</option>
                  <option>Viagem</option>
                  <option>Família</option>
                  <option>Conversa</option>
                </select></label
              >
              <div style="display: inline-flex; align-items: center; gap: 10px; margin-left: 8px">
                <button
                  type="button"
                  class="{{swCls}}"
                  role="switch"
                  aria-checked="{{ocultarTxt}}"
                  aria-labelledby="lbl-ocultar"
                  onClick="{{toggleOcultar}}"
                >
                  <i></i></button
                ><span id="lbl-ocultar" style="font-weight: 700">Ocultar vistos</span>
              </div>
              <label
                style="
                  flex: 1 1 220px;
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  min-height: 44px;
                  border: 2px solid #cfc6b2;
                  border-radius: 999px;
                  background: #fff;
                  padding: 0 16px;
                  box-sizing: border-box;
                "
                ><svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#4A5560"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="M20 20l-3.5-3.5"></path></svg
                ><span
                  style="
                    position: absolute;
                    width: 1px;
                    height: 1px;
                    overflow: hidden;
                    clip: rect(0 0 0 0);
                  "
                  >Buscar vídeos</span
                ><input
                  type="search"
                  placeholder="Buscar"
                  value="{{busca}}"
                  onInput="{{onBusca}}"
                  style="
                    border: 0;
                    outline: none;
                    font:
                      15px &quot;Nunito Sans&quot;,
                      sans-serif;
                    flex: 1;
                    min-width: 0;
                    background: transparent;
                  "
              /></label>
            </div>
          </div>

          <span class="muted" style="font-size: 14px">{{contagem}}</span>

          <div
            style="
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
              gap: 24px;
            "
          >
            <sc-for list="{{videos}}" as="v" hint-placeholder-count="12">
              <div
                class="card"
                style="overflow: hidden; display: flex; flex-direction: column; position: relative"
              >
                <a
                  href="{{v.href}}"
                  style="text-decoration: none; color: inherit; display: block; position: relative"
                >
                  <img class="thumb" src="{{v.img}}" alt="" style="{{v.imgStyle}}" />
                  <span
                    style="
                      position: absolute;
                      left: 10px;
                      bottom: 10px;
                      background: rgba(30, 39, 46, 0.85);
                      color: #fff;
                      border-radius: 8px;
                      padding: 2px 8px;
                      font-weight: 700;
                      font-size: 13px;
                    "
                    >{{v.dur}}</span
                  >
                  <sc-if value="{{v.bloq}}" hint-placeholder-val="{{false}}"
                    ><span
                      style="
                        position: absolute;
                        left: 10px;
                        top: 10px;
                        background: #0a3d62;
                        color: #fff;
                        border-radius: 999px;
                        padding: 4px 10px;
                        font-weight: 700;
                        font-size: 12px;
                        display: inline-flex;
                        gap: 6px;
                        align-items: center;
                      "
                      ><svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.4"
                        stroke-linecap="round"
                        aria-hidden="true"
                      >
                        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg
                      >Participar</span
                    ></sc-if
                  >
                  <sc-if value="{{v.adulto}}" hint-placeholder-val="{{false}}"
                    ><span
                      style="
                        position: absolute;
                        right: 10px;
                        bottom: 10px;
                        background: #c2410c;
                        color: #fff;
                        border-radius: 8px;
                        padding: 2px 8px;
                        font-weight: 700;
                        font-size: 12px;
                      "
                      >+18</span
                    ></sc-if
                  >
                  <sc-if value="{{v.visto}}" hint-placeholder-val="{{false}}"
                    ><span
                      style="
                        position: absolute;
                        right: 10px;
                        bottom: 10px;
                        background: #00b894;
                        color: #0a3d62;
                        border-radius: 999px;
                        padding: 2px 10px;
                        font-weight: 700;
                        font-size: 12px;
                        display: inline-flex;
                        gap: 4px;
                        align-items: center;
                      "
                      ><svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="M5 12.5l4.5 4.5L19 7.5"></path></svg
                      >Visto</span
                    ></sc-if
                  >
                </a>
                <div class="bar" style="border-radius: 0; height: 5px">
                  <i style="{{v.progStyle}}"></i>
                </div>
                <div
                  style="padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 8px"
                >
                  <a
                    href="{{v.href}}"
                    style="
                      font:
                        600 18px &quot;Fredoka&quot;,
                        sans-serif;
                      color: #0a3d62;
                      text-decoration: none;
                    "
                    >{{v.titulo}}</a
                  >
                  <span class="lv {{v.lvc}}" style="align-self: flex-start"
                    ><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                      <path
                        d="M2 12V9M5.5 12V6.5M9 12V4M12.5 12V1.5"
                        stroke="currentColor"
                        stroke-opacity=".3"
                        stroke-width="2"
                        stroke-linecap="round"
                      ></path>
                      <path
                        d="{{v.bars}}"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                      ></path></svg
                    >{{v.lv}}</span
                  >
                  <span class="muted" style="font-size: 13px">{{v.meta}}</span>
                </div>
                <button type="button" class="kebab" aria-label="Opções do vídeo">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="5" r="2"></circle>
                    <circle cx="12" cy="12" r="2"></circle>
                    <circle cx="12" cy="19" r="2"></circle>
                  </svg>
                </button>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{vazio}}" hint-placeholder-val="{{false}}"
            ><div class="card" style="padding: 40px; text-align: center">
              <b
                style="
                  font:
                    600 20px &quot;Fredoka&quot;,
                    sans-serif;
                  color: #0a3d62;
                "
                >Nenhum vídeo com esses filtros</b
              >
              <p class="muted" style="margin: 8px 0 0">Tente tirar um filtro ou mudar o nível.</p>
            </div></sc-if
          >
        </main>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1500}}'>
      class Component extends DCLogic {
        renderVals() {
          const s = this.state;
          const aba = s.aba ?? 'Explorar';
          const nivel = s.nivel ?? 0;
          const ocultar = s.ocultar ?? false;
          const busca = s.busca ?? '';
          const LV = [null,
            { lv: 'Primeiros passos', lvc: 'lv1', bars: 'M2 12V9' },
            { lv: 'Seguindo em frente', lvc: 'lv2', bars: 'M2 12V9M5.5 12V6.5' },
            { lv: 'Mais fluência', lvc: 'lv3', bars: 'M2 12V9M5.5 12V6.5M9 12V4' },
            { lv: 'Quase nativo', lvc: 'lv4', bars: 'M2 12V9M5.5 12V6.5M9 12V4M12.5 12V1.5' }];
          const base = [
            ['Um sábado na feira', 1, 'feira', 'Brasil', 'Márlio', 'Comida', 6.4, 'visto', 0, false],
            ['Um passeio de barco', 1, 'mar', 'Brasil', 'Márlio', 'Viagem', 5.2, 'andamento', 40, false],
            ['A casa da vó', 1, 'campo', 'Brasil', 'Márlio', 'Família', 4.1, 'andamento', 70, false],
            ['Café com o vizinho', 2, 'conversa', 'Brasil', 'Convidado', 'Conversa', 8.3, 'novo', 0, false],
            ['Quanto custa a manga?', 2, 'feira', 'Portugal', 'Márlio', 'Comida', 7.0, 'visto', 0, false],
            ['Férias no litoral', 2, 'mar', 'Brasil', 'Convidado', 'Viagem', 9.5, 'bloqueado', 0, false],
            ['O almoço de domingo', 3, 'campo', 'Brasil', 'Márlio', 'Família', 12.2, 'novo', 0, false],
            ['Discussão no bar', 3, 'conversa', 'Angola', 'Convidado', 'Conversa', 14.0, 'bloqueado', 0, true],
            ['Receita da tia', 3, 'feira', 'Brasil', 'Márlio', 'Comida', 11.4, 'novo', 0, false],
            ['Pescadores de madrugada', 4, 'mar', 'Portugal', 'Convidado', 'Viagem', 18.1, 'novo', 0, false],
            ['Histórias da roça', 4, 'campo', 'Brasil', 'Márlio', 'Família', 21.5, 'bloqueado', 0, false],
            ['Papo sem filtro', 4, 'conversa', 'Brasil', 'Convidado', 'Conversa', 16.7, 'novo', 0, true]
          ].map(([titulo, n, img, pais, apres, tema, min, est, prog, adulto], i) => ({ titulo, n, img, pais, apres, tema, min, est, prog, adulto, i }));
          let list = base.filter((v) =>
            (!nivel || v.n === nivel) &&
            (!s.pais || v.pais === s.pais) &&
            (!s.apres || v.apres === s.apres) &&
            (!s.tema || v.tema === s.tema) &&
            (!ocultar || v.est !== 'visto') &&
            (!busca || v.titulo.toLowerCase().includes(busca.toLowerCase())));
          if (aba === 'Histórico') list = list.filter((v) => v.est === 'visto' || v.est === 'andamento');
          if (aba === 'Salvos') list = list.filter((v) => v.i % 3 === 1);
          const o = s.ordem ?? 'novos';
          if (o === 'faceis') list = [...list].sort((a, b) => a.n - b.n);
          if (o === 'dificeis') list = [...list].sort((a, b) => b.n - a.n);
          if (o === 'curtos') list = [...list].sort((a, b) => a.min - b.min);
          if (o === 'novos') list = [...list].sort((a, b) => b.i - a.i);
          const fmt = (m) => Math.floor(m) + ':' + String(Math.round((m % 1) * 60)).padStart(2, '0');
          const videos = list.map((v) => ({
            ...LV[v.n], titulo: v.titulo, img: 'cenas/' + v.img + '.svg', dur: fmt(v.min),
            href: v.est === 'bloqueado' ? 'App-Planos.dc.html' : 'App-Video.dc.html',
            bloq: v.est === 'bloqueado', visto: v.est === 'visto', adulto: v.adulto && v.est !== 'visto',
            imgStyle: v.est === 'bloqueado' ? 'filter: grayscale(.6); opacity: .75' : '',
            progStyle: 'width: ' + (v.est === 'visto' ? 100 : v.prog) + '%; border-radius: 0',
            meta: v.apres + ' · ' + v.pais + ' · ' + v.tema
          }));
          const sel = (k) => (e) => this.setState({ [k]: e.target.value });
          return {
            abas: ['Explorar', 'Histórico', 'Salvos'].map((nome) => ({ nome, cls: aba === nome ? 'utab on' : 'utab', sel: aba === nome ? 'true' : 'false', pick: () => this.setState({ aba: nome }) })),
            niveis: ['Todos', 'Primeiros passos', 'Seguindo em frente', 'Mais fluência', 'Quase nativo'].map((nome, k) => ({ nome, cls: nivel === k ? 'chip on' : 'chip', sel: nivel === k ? 'true' : 'false', pick: () => this.setState({ nivel: k }) })),
            onOrdem: sel('ordem'), onPais: sel('pais'), onApres: sel('apres'), onTema: sel('tema'),
            onBusca: sel('busca'), busca,
            swCls: ocultar ? 'sw on' : 'sw', ocultarTxt: ocultar ? 'true' : 'false',
            toggleOcultar: () => this.setState({ ocultar: !ocultar }),
            videos, vazio: videos.length === 0,
            contagem: videos.length + (videos.length === 1 ? ' vídeo' : ' vídeos')
          };
        }
      }
    </script>
  </body>
</html>
