<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vocabulário do vídeo</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;family=Caveat:wght@600&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            background: #fdfaf4;
          }
          a {
            color: #0665b8;
          }
          a:hover {
            color: #0a3d62;
          }
          .mi {
            font-family: "Nunito Sans", system-ui, sans-serif;
            color: #1e272e;
            background: #fdfaf4;
            font-size: 16px;
            line-height: 1.55;
          }
          .mi h1,
          .mi h2,
          .mi h3 {
            font-family: "Fredoka", ui-rounded, sans-serif;
            color: #0a3d62;
            margin: 0;
            line-height: 1.15;
            font-weight: 600;
          }
          .wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 32px;
            box-sizing: border-box;
          }
          .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            padding: 0 24px;
            border-radius: 999px;
            background: #0665b8;
            color: #fff;
            font:
              600 16px/1 "Fredoka",
              sans-serif;
            text-decoration: none;
            border: 2px solid #0665b8;
            box-sizing: border-box;
            cursor: pointer;
          }
          .btn:hover {
            background: #05549a;
            color: #fff;
          }
          .btn.sec {
            background: #fff;
            color: #0665b8;
          }
          .card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
          }
          .hand {
            font-family: "Caveat", cursive;
            font-weight: 600;
            color: #c2410c;
          }
          .muted {
            color: #4a5560;
          }
          .bar {
            height: 8px;
            border-radius: 999px;
            background: #ece4d2;
            overflow: hidden;
          }
          .bar i {
            display: block;
            height: 100%;
            background: #00b894;
            border-radius: 999px;
          }
          .tab {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            color: #1e272e;
            text-decoration: none;
            font:
              600 16px "Fredoka",
              sans-serif;
          }
          .tab:hover {
            background: #f6f0e4;
            color: #0a3d62;
          }
          .tab.on {
            color: #0665b8;
            background: #dcebfa;
          }
          .pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 52px;
            padding: 4px 4px 4px 16px;
            border: 2px solid #ece4d2;
            border-radius: 999px;
            background: #fff;
            font:
              700 14px "Nunito Sans",
              sans-serif;
            box-sizing: border-box;
          }
          .ib {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 0;
            background: #dcebfa;
            color: #0665b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            flex: none;
          }
          .wt {
            min-height: 40px;
            padding: 0 12px;
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            font:
              600 15px "Fredoka",
              sans-serif;
            color: #4a5560;
            cursor: pointer;
          }
          .wt.on {
            color: #0665b8;
            border-bottom-color: #0665b8;
          }
          .add {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 2px solid #cfc6b2;
            background: #fff;
            color: #0665b8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: none;
          }
          .add.on {
            background: #00b894;
            border-color: #00b894;
            color: #fff;
          }
          .reveal {
            min-height: 56px;
            width: 100%;
            border: 2px dashed #cfc6b2;
            border-radius: 14px;
            background: #fdfaf4;
            font:
              600 15px "Nunito Sans",
              sans-serif;
            color: #0665b8;
            cursor: pointer;
          }
          :focus-visible {
            outline: 3px solid #0984e3;
            outline-offset: 2px;
          }
        </style>
      </helmet>
      <div class="mi">
        <header style="background: #fff; border-bottom: 1px solid #ece4d2">
          <div
            class="wrap"
            style="
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              gap: 12px 24px;
              padding-top: 10px;
              padding-bottom: 10px;
            "
          >
            <a
              href="App-Inicio.dc.html"
              style="
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                color: #0a3d62;
                font:
                  700 20px &quot;Fredoka&quot;,
                  sans-serif;
              "
              ><img
                src="marca/logo.png"
                alt=""
                width="46"
                height="46"
                style="display: block; width: 46px; height: 46px; object-fit: contain"
              /><span style="display: flex; flex-direction: column; line-height: 1"
                ><span>Mundo</span><span>Ilusófono</span></span
              ></a
            >
            <nav
              aria-label="App"
              style="
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                flex: 1 1 auto;
                justify-content: center;
              "
            >
              <a class="tab on" href="App-Inicio.dc.html" aria-current="page">Início</a
              ><a class="tab" href="App-Assistir.dc.html">Assistir</a
              ><a class="tab" href="App-Series.dc.html">Séries</a
              ><a class="tab" href="App-Lives.dc.html">Lives</a
              ><a class="tab" href="App-Progresso.dc.html">Progresso</a
              ><a class="tab" href="App-Conta.dc.html">Conta</a>
            </nav>
            <div style="display: flex; gap: 10px; align-items: center">
              <div class="pill">
                <span>12/20 min</span
                ><span class="bar" style="width: 64px"><i style="width: 60%"></i></span
                ><a class="ib" href="App-Horas.dc.html" aria-label="Adicionar tempo fora do app"
                  ><svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14M5 12h14"></path></svg
                ></a>
              </div>
              <div
                class="pill"
                style="padding-right: 16px; color: #9a3412"
                aria-label="Sequência de 3 dias"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#9A3412"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"
                  ></path></svg
                >3
              </div>
            </div>
          </div>
        </header>

        <section style="background: #0a3d62; color: #fff">
          <div
            class="wrap"
            style="
              padding-top: 32px;
              padding-bottom: 32px;
              display: flex;
              flex-wrap: wrap;
              gap: 28px;
              align-items: center;
            "
          >
            <img
              src="cenas/feira.svg"
              alt=""
              style="
                width: 240px;
                aspect-ratio: 16/9;
                object-fit: cover;
                border-radius: 16px;
                display: block;
              "
            />
            <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px">
              <span style="color: #dcebfa; font-weight: 700; font-size: 14px"
                >2. Entender o vocabulário</span
              >
              <h1 style="font-size: 34px; color: #fff">Um sábado na feira</h1>
              <span style="color: #dcebfa"
                >Cinco palavras do vídeo. Toque em revelar para ver cada uma.</span
              >
            </div>
          </div>
        </section>

        <main
          class="wrap"
          style="
            padding-top: 32px;
            padding-bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
          "
        >
          <div
            style="
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
              gap: 22px;
            "
          >
            <sc-for list="{{palavras}}" as="w" hint-placeholder-count="5">
              <article class="card" style="overflow: hidden; display: flex; flex-direction: column">
                <img
                  src="{{w.img}}"
                  alt="{{w.alt}}"
                  style="display: block; width: 100%; aspect-ratio: 2/1; object-fit: cover; object-position: {{w.pos}}"
                />
                <div
                  style="padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 12px"
                >
                  <div style="display: flex; align-items: center; gap: 10px">
                    <button type="button" class="ib" aria-label="Ouvir {{w.palavra}}">
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="M4 9v6h4l5 4V5L8 9z"></path>
                        <path d="M16.5 8.5a5 5 0 0 1 0 7"></path>
                      </svg>
                    </button>
                    <h2 style="font-size: 26px; flex: 1">{{w.palavra}}</h2>
                    <button
                      type="button"
                      class="{{w.addCls}}"
                      aria-pressed="{{w.selTxt}}"
                      aria-label="{{w.addLabel}}"
                      onClick="{{w.toggleSel}}"
                    >
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="{{w.addIcon}}"></path>
                      </svg>
                    </button>
                  </div>
                  <div
                    role="tablist"
                    aria-label="Sobre a palavra"
                    style="display: flex; gap: 6px; border-bottom: 1px solid #ece4d2"
                  >
                    <sc-for list="{{w.abas}}" as="t" hint-placeholder-count="3"
                      ><button
                        type="button"
                        role="tab"
                        class="{{t.cls}}"
                        aria-selected="{{t.sel}}"
                        onClick="{{t.pick}}"
                      >
                        {{t.nome}}
                      </button></sc-for
                    >
                  </div>
                  <sc-if value="{{w.revelada}}" hint-placeholder-val="{{false}}">
                    <p style="margin: 0; font-size: 17px; min-height: 56px">{{w.texto}}</p>
                  </sc-if>
                  <sc-if value="{{w.oculta}}" hint-placeholder-val="{{true}}">
                    <button type="button" class="reveal" onClick="{{w.revelar}}">Revelar</button>
                  </sc-if>
                </div>
              </article>
            </sc-for>
          </div>
        </main>

        <div
          style="
            position: sticky;
            bottom: 0;
            background: #fff;
            border-top: 1px solid #ece4d2;
            box-shadow: 0 -4px 16px rgba(30, 39, 46, 0.08);
          "
        >
          <div
            class="wrap"
            style="
              display: flex;
              flex-wrap: wrap;
              gap: 12px;
              align-items: center;
              justify-content: flex-end;
              padding-top: 14px;
              padding-bottom: 14px;
            "
          >
            <span class="hand" style="font-size: 24px; margin-right: auto"
              >não precisa decorar, só reconhecer</span
            >
            <a class="btn sec" href="App-Palavras.dc.html">{{salvarLabel}}</a>
            <a class="btn" href="App-Lives.dc.html">Continuar</a>
          </div>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1200}}'>
      class Component extends DCLogic {
        renderVals() {
          const s = this.state;
          const sel = s.sel ?? { 0: true, 1: true, 2: true, 3: true, 4: true };
          const aba = s.aba ?? {};
          const rev = s.rev ?? { 0: true };
          const dados = [
            ['a feira', 'feira', '50% 40%', 'Barraca de feira', 'Um mercado na rua, com barracas de fruta, verdura e peixe.', 'Todo sábado eu vou à feira com a minha mãe.', 'Onde fica a feira mais perto da sua casa?'],
            ['a manga', 'feira', '30% 60%', 'Frutas amarelas na barraca', 'Uma fruta tropical, doce, amarela por dentro.', 'Moço, quanto tá a manga hoje?', 'Você gosta de manga? Como você come?'],
            ['barato', 'conversa', '50% 30%', 'Duas pessoas conversando', 'Que custa pouco dinheiro.', 'Na feira, a fruta é mais barata.', 'O que é barato na sua cidade?'],
            ['o troco', 'conversa', '50% 70%', 'Duas pessoas conversando', 'O dinheiro que volta quando você paga a mais.', 'Pode ficar com o troco, tá?', 'Você confere o troco quando paga?'],
            ['docinha', 'feira', '70% 60%', 'Frutas na barraca', 'Bem doce. O "inha" deixa a palavra mais carinhosa.', 'Olha, essa manga tá docinha, ó.', 'Qual fruta é docinha para você?']
          ];
          const palavras = dados.map(([palavra, img, pos, alt, def, ex, use], i) => {
            const a = aba[i] ?? 'Definição';
            const isSel = !!sel[i];
            return {
              palavra, alt, pos, img: 'cenas/' + img + '.svg',
              texto: a === 'Definição' ? def : (a === 'Exemplo' ? ex : use),
              revelada: !!rev[i], oculta: !rev[i],
              revelar: () => this.setState({ rev: { ...rev, [i]: true } }),
              abas: ['Definição', 'Exemplo', 'Use'].map((nome) => ({ nome, cls: a === nome ? 'wt on' : 'wt', sel: a === nome ? 'true' : 'false', pick: () => this.setState({ aba: { ...aba, [i]: nome } }) })),
              addCls: isSel ? 'add on' : 'add', selTxt: isSel ? 'true' : 'false',
              addLabel: isSel ? 'Selecionada para salvar' : 'Selecionar para salvar',
              addIcon: isSel ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 5v14M5 12h14',
              toggleSel: () => this.setState({ sel: { ...sel, [i]: !isSel } })
            };
          });
          const n = Object.values(sel).filter(Boolean).length;
          return { palavras, salvarLabel: 'Salvar selecionadas (' + n + ')' };
        }
      }
    </script>
  </body>
</html>
