<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Mais e conta no celular</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;family=Caveat:wght@600&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            background: #fdfaf4;
          }
          a {
            color: #0665b8;
          }
          .m {
            font-family: "Nunito Sans", system-ui, sans-serif;
            color: #1e272e;
            background: #fdfaf4;
            font-size: 16px;
            line-height: 1.5;
          }
          .m h1,
          .m h2 {
            font-family: "Fredoka", ui-rounded, sans-serif;
            color: #0a3d62;
            margin: 0;
            line-height: 1.15;
            font-weight: 600;
          }
          .muted {
            color: #4a5560;
          }
          .bar {
            height: 6px;
            border-radius: 999px;
            background: #ece4d2;
            overflow: hidden;
          }
          .bar i {
            display: block;
            height: 100%;
            background: #00b894;
            border-radius: 999px;
          }
          .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 50px;
            padding: 0 3px 0 12px;
            border: 2px solid #ece4d2;
            border-radius: 999px;
            background: #fff;
            font:
              700 13px "Nunito Sans",
              sans-serif;
            box-sizing: border-box;
          }
          .ib {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 0;
            background: #dcebfa;
            color: #0665b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex: none;
          }
          .nav {
            display: flex;
            border-top: 1px solid #ece4d2;
            background: #fff;
            flex: none;
          }
          .nav a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 64px;
            color: #4a5560;
            text-decoration: none;
            font:
              600 12px "Nunito Sans",
              sans-serif;
          }
          .nav a.on {
            color: #0665b8;
          }
          .group {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
            padding: 4px 16px;
          }
          .item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 54px;
            border-bottom: 1px solid #ece4d2;
            text-decoration: none;
            color: #1e272e;
            font-weight: 600;
          }
          .item:last-child {
            border-bottom: 0;
          }
          .chip {
            flex: 1;
            min-height: 44px;
            border: 2px solid #cfc6b2;
            border-radius: 999px;
            background: #fff;
            font:
              600 14px "Nunito Sans",
              sans-serif;
            color: #1e272e;
            cursor: pointer;
          }
          .chip.on {
            background: #0a3d62;
            border-color: #0a3d62;
            color: #fff;
          }
          .sw {
            position: relative;
            width: 48px;
            height: 28px;
            border-radius: 999px;
            background: #cfc6b2;
            border: 0;
            cursor: pointer;
            flex: none;
            padding: 0;
            margin-left: auto;
          }
          .sw.on {
            background: #00b894;
          }
          .sw i {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: #fff;
          }
          .sw.on i {
            left: 23px;
          }
          :focus-visible {
            outline: 3px solid #0984e3;
            outline-offset: 2px;
          }
        </style>
      </helmet>
      <div
        class="m"
        style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden"
      >
        <header
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #fff;
            border-bottom: 1px solid #ece4d2;
            flex: none;
          "
        >
          <a
            href="M-Inicio.dc.html"
            aria-label="Mundo Ilusófono, início"
            style="display: flex; margin-right: auto"
            ><img
              src="marca/logo.png"
              alt=""
              width="46"
              height="46"
              style="display: block; width: 46px; height: 46px; object-fit: contain"
          /></a>
          <div class="pill">
            <span>12/20 min</span
            ><span class="bar" style="width: 40px"><i style="width: 60%"></i></span
            ><a class="ib" href="M-Horas.dc.html" aria-label="Adicionar tempo fora do app"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M12 5v14M5 12h14"></path></svg
            ></a>
          </div>
          <div
            class="pill"
            style="padding-right: 12px; color: #9a3412"
            aria-label="Sequência de 3 dias"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#9A3412"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"
              ></path></svg
            >3
          </div>
        </header>

        <main
          style="
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
          "
        >
          <div style="display: flex; gap: 12px; align-items: center">
            <span
              style="
                width: 52px;
                height: 52px;
                border-radius: 999px;
                background: #dcebfa;
                color: #0665b8;
                display: flex;
                align-items: center;
                justify-content: center;
                font:
                  700 20px &quot;Fredoka&quot;,
                  sans-serif;
              "
              >A</span
            >
            <div>
              <h1 style="font-size: 22px">Ana Souza</h1>
              <span class="muted" style="font-size: 14px">ana@email.com · plano Entender</span>
            </div>
          </div>

          <nav class="group" aria-label="Mais">
            <a class="item" href="M-Progresso.dc.html"
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0665B8"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M4 20V10M10 20V4M16 20v-7M2 20h20"></path></svg
              >Progresso</a
            >
            <a class="item" href="M-Palavras.dc.html"
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0665B8"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="6" width="14" height="14" rx="2"></rect>
                <path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg
              >Palavras</a
            >
            <a class="item" href="App-Planos.dc.html"
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0665B8"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="6" width="18" height="13" rx="2"></rect>
                <path d="M3 10h18"></path></svg
              >Planos e pagamento</a
            >
            <a class="item" href="Site-Recursos.dc.html"
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0665B8"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9"></circle>
                <path
                  d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14M12 17.5v.01"
                ></path></svg
              >Ajuda</a
            >
          </nav>

          <section
            class="group"
            style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px"
          >
            <h2 style="font-size: 18px" id="m-meta">Meta diária</h2>
            <div role="group" aria-labelledby="m-meta" style="display: flex; gap: 6px">
              <sc-for list="{{metas}}" as="m" hint-placeholder-count="4"
                ><button
                  type="button"
                  class="{{m.cls}}"
                  aria-pressed="{{m.sel}}"
                  onClick="{{m.pick}}"
                >
                  {{m.n}} min
                </button></sc-for
              >
            </div>
          </section>

          <section class="group">
            <sc-for list="{{prefs}}" as="p" hint-placeholder-count="4"
              ><div class="item">
                <span id="{{p.id}}">{{p.nome}}</span
                ><button
                  type="button"
                  class="{{p.cls}}"
                  role="switch"
                  aria-checked="{{p.sel}}"
                  aria-labelledby="{{p.id}}"
                  onClick="{{p.toggle}}"
                >
                  <i></i>
                </button></div
            ></sc-for>
          </section>

          <a
            href="M-Entrar.dc.html"
            style="
              color: #c2410c;
              font-weight: 700;
              min-height: 48px;
              display: flex;
              align-items: center;
              justify-content: center;
            "
            >Sair</a
          >
        </main>

        <nav class="nav" aria-label="App">
          <a href="M-Inicio.dc.html"
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"></path></svg
            >Início</a
          >
          <a href="M-Assistir.dc.html"
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="12" rx="2"></rect>
              <path d="M10 9l4 2-4 2z"></path>
              <path d="M8 21h8"></path></svg
            >Assistir</a
          >
          <a href="M-Series.dc.html"
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="7" width="14" height="13" rx="2"></rect>
              <path d="M7 4h12a2 2 0 0 1 2 2v11"></path></svg
            >Séries</a
          >
          <a href="M-Lives.dc.html"
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="2"></circle>
              <path
                d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"
              ></path></svg
            >Lives</a
          >
          <a class="on" href="M-Conta.dc.html" aria-current="page"
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M4 7h16M4 12h16M4 17h16"></path></svg
            >Mais</a
          >
        </nav>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        renderVals() {
          const meta = this.state.meta ?? 20;
          const p = this.state.p ?? { leg: true, escuro: false, semanal: true, novos: true };
          const lista = [['leg', 'Legendas ligadas'], ['escuro', 'Modo escuro'], ['novos', 'E-mail: vídeos novos'], ['semanal', 'E-mail semanal']];
          return {
            metas: [10, 20, 30, 45].map((n) => ({ n, cls: meta === n ? 'chip on' : 'chip', sel: meta === n ? 'true' : 'false', pick: () => this.setState({ meta: n }) })),
            prefs: lista.map(([k, nome]) => ({ id: 'mp-' + k, nome, cls: p[k] ? 'sw on' : 'sw', sel: p[k] ? 'true' : 'false', toggle: () => this.setState({ p: { ...p, [k]: !p[k] } }) }))
          };
        }
      }
    </script>
  </body>
</html>
