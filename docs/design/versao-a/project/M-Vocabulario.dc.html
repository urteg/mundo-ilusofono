<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vocabulário no celular</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;family=Caveat:wght@600&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            background: #fdfaf4;
          }
          a {
            color: #0665b8;
          }
          .m {
            font-family: "Nunito Sans", system-ui, sans-serif;
            color: #1e272e;
            background: #fdfaf4;
            font-size: 16px;
            line-height: 1.5;
          }
          .m h1,
          .m h2 {
            font-family: "Fredoka", ui-rounded, sans-serif;
            color: #0a3d62;
            margin: 0;
            line-height: 1.15;
            font-weight: 600;
          }
          .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 50px;
            padding: 0 16px;
            border-radius: 999px;
            background: #0665b8;
            color: #fff;
            font:
              600 16px/1 "Fredoka",
              sans-serif;
            text-decoration: none;
            border: 2px solid #0665b8;
            box-sizing: border-box;
            flex: 1;
          }
          .btn.sec {
            background: #fff;
            color: #0665b8;
          }
          .ib {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 0;
            background: #dcebfa;
            color: #0665b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            cursor: pointer;
          }
          .wt {
            min-height: 40px;
            padding: 0 10px;
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            font:
              600 14px "Fredoka",
              sans-serif;
            color: #4a5560;
            cursor: pointer;
          }
          .wt.on {
            color: #0665b8;
            border-bottom-color: #0665b8;
          }
          .add {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 2px solid #cfc6b2;
            background: #fff;
            color: #0665b8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: none;
          }
          .add.on {
            background: #00b894;
            border-color: #00b894;
            color: #fff;
          }
          .reveal {
            min-height: 52px;
            width: 100%;
            border: 2px dashed #cfc6b2;
            border-radius: 14px;
            background: #fdfaf4;
            font:
              600 15px "Nunito Sans",
              sans-serif;
            color: #0665b8;
            cursor: pointer;
          }
          :focus-visible {
            outline: 3px solid #0984e3;
            outline-offset: 2px;
          }
        </style>
      </helmet>
      <div
        class="m"
        style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden"
      >
        <div
          style="
            flex: none;
            background: #0a3d62;
            color: #fff;
            padding: 6px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
          "
        >
          <a
            href="M-Video.dc.html"
            aria-label="Voltar para o vídeo"
            style="
              width: 44px;
              height: 44px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #fff;
            "
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 5l-7 7 7 7"></path></svg
          ></a>
          <div style="display: flex; gap: 12px; align-items: center; padding: 0 4px">
            <img
              src="cenas/feira.svg"
              alt=""
              style="width: 96px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px"
            />
            <div>
              <span style="color: #dcebfa; font-weight: 700; font-size: 13px"
                >2. Entender o vocabulário</span
              >
              <h1 style="font-size: 21px; color: #fff">Um sábado na feira</h1>
            </div>
          </div>
        </div>

        <main
          style="
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          "
        >
          <sc-for list="{{palavras}}" as="w" hint-placeholder-count="5">
            <article
              style="
                background: #fff;
                border-radius: 18px;
                box-shadow: 0 4px 16px rgba(30, 39, 46, 0.1);
                overflow: hidden;
              "
            >
              <img
                src="{{w.img}}"
                alt="{{w.alt}}"
                style="display: block; width: 100%; aspect-ratio: 3/1; object-fit: cover; object-position: {{w.pos}}"
              />
              <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px">
                <div style="display: flex; align-items: center; gap: 10px">
                  <button type="button" class="ib" aria-label="Ouvir {{w.palavra}}">
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M4 9v6h4l5 4V5L8 9z"></path>
                      <path d="M16.5 8.5a5 5 0 0 1 0 7"></path>
                    </svg>
                  </button>
                  <h2 style="font-size: 22px; flex: 1">{{w.palavra}}</h2>
                  <button
                    type="button"
                    class="{{w.addCls}}"
                    aria-pressed="{{w.selTxt}}"
                    aria-label="{{w.addLabel}}"
                    onClick="{{w.toggleSel}}"
                  >
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="{{w.addIcon}}"></path>
                    </svg>
                  </button>
                </div>
                <div
                  role="tablist"
                  aria-label="Sobre a palavra"
                  style="display: flex; gap: 4px; border-bottom: 1px solid #ece4d2"
                >
                  <sc-for list="{{w.abas}}" as="t" hint-placeholder-count="3"
                    ><button
                      type="button"
                      role="tab"
                      class="{{t.cls}}"
                      aria-selected="{{t.sel}}"
                      onClick="{{t.pick}}"
                    >
                      {{t.nome}}
                    </button></sc-for
                  >
                </div>
                <sc-if value="{{w.revelada}}" hint-placeholder-val="{{false}}"
                  ><p style="margin: 0; font-size: 16px; min-height: 52px">{{w.texto}}</p></sc-if
                >
                <sc-if value="{{w.oculta}}" hint-placeholder-val="{{true}}"
                  ><button type="button" class="reveal" onClick="{{w.revelar}}">
                    Revelar
                  </button></sc-if
                >
              </div>
            </article>
          </sc-for>
        </main>

        <div
          style="
            flex: none;
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #ece4d2;
          "
        >
          <a class="btn sec" href="App-Palavras.dc.html">{{salvarLabel}}</a>
          <a class="btn" href="M-Lives.dc.html">Continuar</a>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        renderVals() {
          const s = this.state;
          const sel = s.sel ?? { 0: true, 1: true, 2: true, 3: true, 4: true };
          const aba = s.aba ?? {};
          const rev = s.rev ?? { 0: true };
          const dados = [
            ['a feira', 'feira', '50% 40%', 'Barraca de feira', 'Um mercado na rua, com barracas de fruta e verdura.', 'Todo sábado eu vou à feira.', 'Onde fica a feira mais perto de você?'],
            ['a manga', 'feira', '30% 60%', 'Frutas na barraca', 'Uma fruta tropical, doce, amarela por dentro.', 'Moço, quanto tá a manga hoje?', 'Você gosta de manga?'],
            ['barato', 'conversa', '50% 30%', 'Duas pessoas conversando', 'Que custa pouco dinheiro.', 'Na feira, a fruta é mais barata.', 'O que é barato na sua cidade?'],
            ['o troco', 'conversa', '50% 70%', 'Duas pessoas conversando', 'O dinheiro que volta quando você paga a mais.', 'Pode ficar com o troco, tá?', 'Você confere o troco?'],
            ['docinha', 'feira', '70% 60%', 'Frutas na barraca', 'Bem doce, de um jeito carinhoso.', 'Essa manga tá docinha, ó.', 'Qual fruta é docinha para você?']
          ];
          const palavras = dados.map(([palavra, img, pos, alt, def, ex, use], i) => {
            const a = aba[i] ?? 'Definição';
            const isSel = !!sel[i];
            return {
              palavra, alt, pos, img: 'cenas/' + img + '.svg',
              texto: a === 'Definição' ? def : (a === 'Exemplo' ? ex : use),
              revelada: !!rev[i], oculta: !rev[i], revelar: () => this.setState({ rev: { ...rev, [i]: true } }),
              abas: ['Definição', 'Exemplo', 'Use'].map((nome) => ({ nome, cls: a === nome ? 'wt on' : 'wt', sel: a === nome ? 'true' : 'false', pick: () => this.setState({ aba: { ...aba, [i]: nome } }) })),
              addCls: isSel ? 'add on' : 'add', selTxt: isSel ? 'true' : 'false',
              addLabel: isSel ? 'Selecionada para salvar' : 'Selecionar para salvar',
              addIcon: isSel ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 5v14M5 12h14',
              toggleSel: () => this.setState({ sel: { ...sel, [i]: !isSel } })
            };
          });
          const n = Object.values(sel).filter(Boolean).length;
          return { palavras, salvarLabel: 'Salvar (' + n + ')' };
        }
      }
    </script>
  </body>
</html>
